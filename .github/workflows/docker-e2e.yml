name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and test the Docker cluster
        env:
          DSEARCH_E2E_DIAGNOSTICS: ${{ runner.temp }}/dsearch-e2e-diagnostics
        run: scripts/docker-cluster-e2e.sh

      - name: Upload Docker cluster diagnostics and recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-cluster-diagnostics
          path: ${{ runner.temp }}/dsearch-e2e-diagnostics
          if-no-files-found: error
