name: Publish Docker images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - dk.index-node
          - dk.query-node
          - dk.coordinator
          - dk.gateway

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify main release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ "$TAG" == "$VERSION" || -z "$VERSION" || "$VERSION" == *"/"* ]]; then
            echo "Release tags must use the v<version> form; got $TAG" >&2
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $TAG must point to a commit reachable from main" >&2
            exit 1
          fi

          MAVEN_VERSION="$(mvn -B -ntp help:evaluate -Dexpression=project.version -DforceStdout -q | tail -n 1)"
          if [[ "$MAVEN_VERSION" == *-SNAPSHOT ]]; then
            echo "Release tag $TAG cannot publish Maven snapshot version $MAVEN_VERSION" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$MAVEN_VERSION" ]]; then
            echo "Release tag $TAG does not match Maven version $MAVEN_VERSION" >&2
            exit 1
          fi

          IMAGE_TAG="$MAVEN_VERSION"
          if [[ "$IMAGE_TAG" != "$VERSION" ]]; then
            echo "Image tag $IMAGE_TAG does not match release version $VERSION" >&2
            exit 1
          fi
          echo "version=$MAVEN_VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.image_tag }}"

          # Always publish an immutable, versioned tag.
          VERSIONED="ghcr.io/${{ github.repository }}/${{ matrix.service }}:${TAG}"

          # Only publish :latest for non-RC tags.
          # (Treat tags containing "-rc" / "-RC" as release candidates.)
          if echo "$TAG" | grep -Eiq '(^|[-.])rc([0-9].*)?$|[-.]rc'; then
            echo "TAGS=${VERSIONED}" >> "$GITHUB_OUTPUT"
          else
            LATEST="ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest"
            echo -e "TAGS=${VERSIONED}\n${LATEST}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
