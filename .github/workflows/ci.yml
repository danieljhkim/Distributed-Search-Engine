name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same ref (helps when you push multiple times to a PR)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Spotless check
        run: mvn -B -ntp spotless:check

      - name: Unit tests
        run: mvn -B -ntp test

  docker-build:
    name: Docker build (PR check)
    runs-on: ubuntu-latest
    needs: java
    if: github.event_name == 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        docker:
          - context: ./dk.gateway
            file: ./dk.gateway/Dockerfile
            tag: dsearch-gateway:ci
          - context: ./dk.coordinator
            file: ./dk.coordinator/Dockerfile
            tag: dsearch-coordinator:ci
          - context: ./dk.index-node
            file: ./dk.index-node/Dockerfile
            tag: dsearch-index-node:ci
          - context: ./dk.query-node
            file: ./dk.query-node/Dockerfile
            tag: dsearch-query-node:ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.docker.context }}
          file: ${{ matrix.docker.file }}
          push: false
          # Multi-arch build as a build-only verification (no push)
          platforms: linux/amd64,linux/arm64
          tags: ${{ matrix.docker.tag }}
