name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref (helps when you push multiple times to a PR)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Spotless check
        run: mvn -B -ntp spotless:check

      - name: Unit tests
        run: mvn -B -ntp verify

      - name: Coverage guard fixture
        run: |
          # A deliberately impossible line floor simulates a coverage regression. The
          # build must fail and name the JaCoCo line counter for dk.common.
          if mvn -B -ntp -pl dk.common -am verify -Dcoverage.minimum.line=1.0000; then
            echo "Coverage guard accepted a synthetic regression"
            exit 1
          fi

      - name: Benchmark harness contract
        run: make -C benchmark check

      - name: Recovery manifest contract
        run: scripts/test-dsearch-recovery-manifest.sh

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: |
            dk.*/target/site/jacoco/**
            dk.coverage/target/site/jacoco-aggregate/**
          if-no-files-found: error
