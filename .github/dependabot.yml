      - "dependencies"
      - "docker"
    groups:
      docker-base-images:
        patterns:
          - "*"
    ignore:
      # Avoid major tag jumps (e.g., 21 -> 25) for base images
      - dependency-name: "eclipse-temurin"
        update-types:
          - "version-update:semver-major"

      - dependency-name: "maven"
        update-types:
          - "version-update:semver-major"
