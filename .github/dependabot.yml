version: 2
updates:
  # Keep GitHub Actions up to date (workflow actions like actions/checkout, docker/*, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maven dependencies (root / multi-module)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:10"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
      - "maven"
    groups:
      maven-dependencies:
        patterns:
          - "*"

  # Dockerfiles (each service)
  - package-ecosystem: "docker"
    directory: "/dk.gateway"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:20"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-base-images:
        patterns:
          - "*"
    ignore:
      # Stay on Java 21 for base images (avoid non-LTS/next-major bumps like 25)
      - dependency-name: "eclipse-temurin"
        versions:
          - "22*"
          - "23*"
          - "24*"
          - "25*"
          - "26*"
          - "27*"
          - "28*"
          - "29*"
          - "3*"

      # Avoid pre-release / RC tags
      - dependency-name: "eclipse-temurin"
        versions:
          - "*rc*"
          - "*RC*"
          - "*alpha*"
          - "*beta*"
          - "*preview*"

      - dependency-name: "maven"
        versions:
          - "*rc*"
          - "*RC*"
          - "*alpha*"
          - "*beta*"
          - "*preview*"

  - package-ecosystem: "docker"
