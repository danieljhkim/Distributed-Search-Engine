syntax = "proto3";

package dsearch.index;

option java_package = "com.danieljhkim.dsearch.proto.index";
option java_multiple_files = true;
import "common/search_type.proto";
import "common/filter.proto";
import "common/facet.proto";
import "common/sort.proto";

message Field {
  string name = 1;
  string value = 2;
}

message Document {
  string id = 1;
  repeated Field fields = 2;
}

// Stable identity and fencing carried by every replicated mutation. The
// primary must be written first; replicas accept only their declared target
// and reject operations from older placement generations.
message MutationMetadata {
  string operation_id = 1;
  // Positive values are caller-owned and must remain unchanged on every copy. Zero asks
  // the declared primary to durably allocate the next per-document generation; replicas
  // reject zero and receive the positive committed_generation returned by the primary.
  uint64 operation_generation = 2;
  uint64 placement_generation = 3;
  string primary_node_id = 4;
  string target_node_id = 5;
  bool replica = 6;
  string logical_partition_id = 7;
}

message IndexDocumentRequest {
  string partition_id = 1;
  Document document = 2;
  MutationMetadata mutation = 3;
}

message IndexDocumentResponse {
  string id = 1;
  // True only after the document has been committed to the shard's Lucene index.
  bool success = 2;
  bool duplicate = 3;
  uint64 committed_generation = 4;
}

message BulkIndexDocumentRequest {
  string partition_id = 1;
  repeated Document documents = 2;
  repeated MutationMetadata mutations = 3;
}

message BulkIndexDocumentResult {
  // Zero-based position in BulkIndexDocumentRequest.documents.
  int32 request_index = 1;
  // Stable id to use when retrying, including when the request omitted an id.
  string id = 2;
  // True only after this document has been committed to the shard's Lucene index.
  bool success = 3;
  // Non-empty when success is false. A failure has unknown commit outcome and is safe
  // to retry with this id because indexing is an upsert.
  string error = 4;
}

message BulkIndexDocumentResponse {
  // Backward-compatible list containing only durably acknowledged document ids.
  repeated string ids = 1;
  // True only when every result is durably acknowledged.
  bool success = 2;
  // One result per request document, in request order.
  repeated BulkIndexDocumentResult results = 3;
}

message DeleteDocumentRequest {
  string partition_id = 1;
  string id = 2;
  MutationMetadata mutation = 3;
}

message DeleteDocumentResponse {
  bool success = 1;
  bool duplicate = 2;
  uint64 committed_generation = 3;
}

// Exact document retrieval intentionally carries an id as a term, never a query string.
message GetDocumentRequest {
  string partition_id = 1;
  string id = 2;
}

message GetDocumentResponse {
  Document document = 1;
}

// This is a point-in-time Lucene cardinality for one physical shard. Gateways
// aggregate one selected eligible replica per logical shard and report any
// unavailable observations rather than treating them as empty shards.
message GetDocumentCountRequest {
  string partition_id = 1;
}

message GetDocumentCountResponse {
  int64 document_count = 1;
}

message BulkDeleteDocumentRequest {
  string partition_id = 1;
  // Explicit ids to delete, in caller order. Duplicates are preserved positionally rather
  // than collapsed, since deleting the same id twice is a harmless idempotent no-op.
  repeated string ids = 2;
  repeated MutationMetadata mutations = 3;
}

message BulkDeleteDocumentResult {
  // Zero-based position in BulkDeleteDocumentRequest.ids.
  int32 request_index = 1;
  string id = 2;
  // True once this id's delete has been durably committed to the shard's Lucene index,
  // including when the id had no matching document: deleting a missing document is the
  // same idempotent success as single delete.
  bool success = 3;
  // Non-empty when success is false.
  string error = 4;
}

message BulkDeleteDocumentResponse {
  // One result per request id, in request order, including duplicates.
  repeated BulkDeleteDocumentResult results = 1;
  // True only when every result is durably acknowledged.
  bool success = 2;
}

message IndexSearchRequest {
  string partition_id = 1;
  string query = 2;
  int32 from = 3;
  int32 size = 4;
  dsearch.common.SearchType search_type = 5;
  repeated dsearch.common.Filter filters = 6;
  bool highlight = 7;
  repeated dsearch.common.FacetRequest facets = 8;
  // Effective total ordering, already tie-broken by the caller. Empty means
  // relevance order.
  repeated dsearch.common.SortField sort = 9;
  // Resume point, positionally matched to `sort`. When set the shard returns the
  // first `size` hits strictly after this tuple, so a deep page never costs more
  // than `size` hits per node.
  repeated dsearch.common.SortValue search_after = 10;
  // True when `search_after` is meaningful. Distinguishes a genuine resume from an
  // absent tuple, since an empty repeated field is indistinguishable from unset.
  bool has_search_after = 11;
  // Optional response projection forwarded by the query node. Presence is
  // significant: an empty selection requests no user stored fields.
  StoredFieldSelection stored_field_selection = 12;
}

message StoredFieldSelection {
  repeated string fields = 1;
}

message IndexHit {
  string partition_id = 1;
  string doc_id = 2;
  float score = 3;
  optional string content = 4;
  optional string title = 5;
  int32 rank = 6;
  map<string, string> highlighted_fields = 7;
  map<string, string> fields = 8;
  // Sort tuple for this hit, positionally matched to IndexSearchRequest.sort.
  repeated dsearch.common.SortValue sort_values = 9;
}

message IndexSearchResponse {
  repeated IndexHit hits = 1;
  int64 total_hits = 2;
  dsearch.common.SearchType search_type = 3;
  repeated dsearch.common.FacetResponse facets = 4;
}

message AnalyzerConfig {
  string name = 1;
}

message IndexSchemaField {
  string name = 1;
  string type = 2;
  bool filterable = 3;
  bool sortable = 4;
  bool facetable = 5;
  bool highlightable = 6;
  string analyzer = 7;
}

message EmbeddingModelIdentity {
  string model_id = 1;
  string engine = 2;
  string digest = 3;
  int32 dimension = 4;
}

message IndexSchema {
  int32 compatibility_version = 1;
  AnalyzerConfig analyzer = 2;
  repeated IndexSchemaField fields = 3;
  EmbeddingModelIdentity embedding = 4;
}

message CreateIndexRequest {
  string index_name = 1;
  string alias = 2;
  IndexSchema schema = 3;
}

message CreateIndexResponse {
  bool success = 1;
  string index_name = 2;
  string alias = 3;
  string audit_id = 4;
}

message InspectSchemaRequest {
  string index_or_alias = 1;
}

message InspectSchemaResponse {
  string index_name = 1;
  string alias = 2;
  IndexSchema schema = 3;
  // Alias generation currently serving this index. Cursors bind to it so an alias
  // swap or rollback invalidates them instead of resuming against a different index.
  int64 generation = 4;
}

message AnalyzeIndexRequest {
  string index_or_alias = 1;
  string text = 2;
}

message AnalyzeToken {
  string token = 1;
  int32 position = 2;
  int32 start_offset = 3;
  int32 end_offset = 4;
}

message AnalyzeIndexResponse {
  string index_name = 1;
  string alias = 2;
  // Name of the analyzer actually used by the resolved index, matching the persisted schema.
  string analyzer = 3;
  repeated AnalyzeToken tokens = 4;
  // True when the token stream was cut short by the configured token limit.
  bool truncated = 5;
}

message RepresentativeQuery {
  string query = 1;
  dsearch.common.SearchType search_type = 2;
  int32 size = 3;
}

message ReindexRequest {
  string source_alias = 1;
  string target_index = 2;
  IndexSchema schema = 3;
  repeated RepresentativeQuery verification_queries = 4;
}

message ReindexResponse {
  bool success = 1;
  string source_index = 2;
  string target_index = 3;
  int64 source_count = 4;
  int64 target_count = 5;
  bool verification_passed = 6;
  string audit_id = 7;
  string error = 8;
}

message SwapAliasRequest {
  string alias = 1;
  string target_index = 2;
}

message SwapAliasResponse {
  bool success = 1;
  string alias = 2;
  string previous_index = 3;
  string current_index = 4;
  string audit_id = 5;
}

message RollbackAliasRequest {
  string alias = 1;
}

message RollbackAliasResponse {
  bool success = 1;
  string alias = 2;
  string current_index = 3;
  string previous_index = 4;
  string audit_id = 5;
}

// A manifest describes one durable physical shard commit.  The content checksum is
// over the canonical committed documents and replication fence metadata, not over
// Lucene's incidental segment layout, so independently committed but equivalent
// replicas compare equal.
message ReplicaManifest {
  string shard_id = 1;
  string logical_partition_id = 2;
  string primary_node_id = 3;
  uint64 placement_generation = 4;
  uint64 committed_position = 5;
  string content_checksum = 6;
  int64 document_count = 7;
  string state = 8;
  string last_error = 9;
}

message ListReplicaManifestsRequest {}

message ListReplicaManifestsResponse {
  repeated ReplicaManifest manifests = 1;
}

message OpenReplicaSnapshotRequest {
  string shard_id = 1;
  uint64 max_snapshot_bytes = 2;
}

message OpenReplicaSnapshotResponse {
  string snapshot_id = 1;
  uint64 total_bytes = 2;
  string transfer_checksum = 3;
  ReplicaManifest manifest = 4;
}

message ReadReplicaSnapshotChunkRequest {
  string snapshot_id = 1;
  uint64 offset = 2;
  uint32 max_bytes = 3;
}

message ReadReplicaSnapshotChunkResponse {
  uint64 offset = 1;
  bytes data = 2;
  bool complete = 3;
}

message BeginReplicaRepairRequest {
  string repair_id = 1;
  ReplicaManifest manifest = 2;
  string snapshot_id = 3;
  uint64 total_bytes = 4;
  string transfer_checksum = 5;
}

message BeginReplicaRepairResponse {
  uint64 accepted_offset = 1;
}

message WriteReplicaRepairChunkRequest {
  string repair_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message WriteReplicaRepairChunkResponse {
  uint64 accepted_offset = 1;
}

message FinishReplicaRepairRequest {
  string repair_id = 1;
}

message FinishReplicaRepairResponse {
  ReplicaManifest manifest = 1;
}

message AbortReplicaRepairRequest {
  string repair_id = 1;
  string reason = 2;
}

message AbortReplicaRepairResponse {
  bool success = 1;
}

service IndexService {
  rpc IndexDocument(IndexDocumentRequest) returns (IndexDocumentResponse);
  rpc BulkIndexDocument(BulkIndexDocumentRequest) returns (BulkIndexDocumentResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc GetDocumentCount(GetDocumentCountRequest) returns (GetDocumentCountResponse);
  rpc BulkDeleteDocument(BulkDeleteDocumentRequest) returns (BulkDeleteDocumentResponse);
  rpc SearchIndex(IndexSearchRequest) returns (IndexSearchResponse);
  rpc CreateIndex(CreateIndexRequest) returns (CreateIndexResponse);
  rpc InspectSchema(InspectSchemaRequest) returns (InspectSchemaResponse);
  rpc AnalyzeIndex(AnalyzeIndexRequest) returns (AnalyzeIndexResponse);
  rpc Reindex(ReindexRequest) returns (ReindexResponse);
  rpc SwapAlias(SwapAliasRequest) returns (SwapAliasResponse);
  rpc RollbackAlias(RollbackAliasRequest) returns (RollbackAliasResponse);
  rpc ListReplicaManifests(ListReplicaManifestsRequest) returns (ListReplicaManifestsResponse);
  rpc OpenReplicaSnapshot(OpenReplicaSnapshotRequest) returns (OpenReplicaSnapshotResponse);
  rpc ReadReplicaSnapshotChunk(ReadReplicaSnapshotChunkRequest) returns (ReadReplicaSnapshotChunkResponse);
  rpc BeginReplicaRepair(BeginReplicaRepairRequest) returns (BeginReplicaRepairResponse);
  rpc WriteReplicaRepairChunk(WriteReplicaRepairChunkRequest) returns (WriteReplicaRepairChunkResponse);
  rpc FinishReplicaRepair(FinishReplicaRepairRequest) returns (FinishReplicaRepairResponse);
  rpc AbortReplicaRepair(AbortReplicaRepairRequest) returns (AbortReplicaRepairResponse);
}
