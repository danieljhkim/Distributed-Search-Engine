syntax = "proto3";

package dsearch.query;

option java_package = "com.danieljhkim.dsearch.proto.query";
option java_multiple_files = true;
import "common/search_type.proto";
import "common/fusion_strategy.proto";
import "common/filter.proto";
import "common/facet.proto";
import "common/sort.proto";

message QueryRequest {
  string query_string = 1;
  string partition_id = 2;
  int32 top_k = 3;
  int32 page = 4;
  int32 size = 5;
  dsearch.common.SearchType search_type = 6;
  dsearch.common.FusionStrategy fusion_strategy = 7;
  repeated dsearch.common.Filter filters = 8;
  repeated dsearch.common.FacetRequest facets = 9;
  bool highlight = 10;
  // Total ordering for the result set. Empty means relevance order. `_id ASC` is
  // always appended so the effective ordering is total and unique.
  repeated dsearch.common.SortField sort = 11;
  // Opaque cursor from a previous QueryResponse.next_cursor. Mutually exclusive
  // with a non-zero `page`.
  string cursor = 12;
}

message SearchHit {
  string doc_id = 1;
  double score = 2;
  string content = 3;
  string title = 4;
  map<string, string> highlighted_fields = 5;
  map<string, string> fields = 6;
  // Sort tuple for this hit, positionally matched to QueryRequest.sort plus the
  // appended `_id` tie-breaker. Populated only when a sort was requested.
  repeated dsearch.common.SortValue sort_values = 7;
}

enum FanoutStatus {
  FANOUT_STATUS_UNSPECIFIED = 0;
  FANOUT_STATUS_SUCCESS = 1;
  FANOUT_STATUS_PARTIAL_FAILURE = 2;
  FANOUT_STATUS_FAILED = 3;
}

message FanoutMetadata {
  int32 attempted_nodes = 1;
  int32 succeeded_nodes = 2;
  int32 failed_nodes = 3;
  int32 timed_out_nodes = 4;
  FanoutStatus status = 5;
}

message QueryResponse {
  repeated SearchHit hits = 1;
  int64 total_hits = 2;
  int32 page = 3;
  int32 size = 4;
  repeated dsearch.common.FacetResponse facets = 5;
  FanoutMetadata fanout = 6;
  // Opaque cursor for the next page. Empty when the result set is exhausted or
  // when the request used legacy offset paging.
  string next_cursor = 7;
}

service QueryService {
  rpc Search(QueryRequest) returns (QueryResponse);
}