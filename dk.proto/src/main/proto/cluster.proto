syntax = "proto3";

package dsearch.cluster;

option java_package = "com.danieljhkim.dsearch.proto.cluster";
option java_multiple_files = true;

enum NodeRole {
  NODE_ROLE_UNKNOWN = 0;
  NODE_ROLE_INDEX = 1;
  NODE_ROLE_QUERY = 2;
  NODE_ROLE_COORDINATOR = 3;
}

message RegisterNodeRequest {
  string node_id = 1;
  string host = 2;
  int32 port = 3;
  NodeRole role = 4;
  int32 health_port = 5;
  string observed_topology_epoch = 6;
  uint64 observed_topology_version = 7;
}

message RegisterNodeResponse {
  bool success = 1;
  // Contract version understood by the coordinator. Version 1 is the first
  // authoritative topology contract.
  uint32 contract_version = 2;
  string topology_epoch = 3;
  uint64 topology_version = 4;
  uint64 lease_duration_millis = 5;
}

message GetClusterInfoRequest {
  NodeRole role = 1;
  // Reserved for future partition-aware discovery. Current coordinator ignores this field.
  string partition_id = 2;
  // Fail closed if the coordinator cannot serve at least this version.
  uint64 min_topology_version = 3;
}

message GetClusterInfoResponse {
    repeated NodeInfo nodes = 1;
    string routingStrategy = 2;
    string componentLabel = 3;
    int32 replicationFactor = 4;
    uint32 contract_version = 5;
    string topology_epoch = 6;
    uint64 topology_version = 7;
    // Bounded policy names: one, quorum, or all; available or acknowledged.
    string durability_policy = 8;
    string read_consistency = 9;
}

// Renews a registered node's lease. A heartbeat never creates membership;
// callers must RegisterNode first. observed_topology_version protects a client
// from accidentally accepting a coordinator whose durable state is older than
// topology it has already observed.
message HeartbeatRequest {
  string node_id = 1;
  NodeRole role = 2;
  uint64 observed_topology_version = 3;
  // Epochs make topology versions comparable. A non-empty stale epoch is
  // rejected so a client re-registers instead of accepting reset state.
  string observed_topology_epoch = 4;
}

message HeartbeatResponse {
  bool success = 1;
  uint32 contract_version = 2;
  string topology_epoch = 3;
  uint64 topology_version = 4;
  uint64 lease_duration_millis = 5;
}

// Graceful deregistration is best-effort. Lease expiry remains authoritative
// when a process cannot complete this RPC during shutdown.
message DeregisterNodeRequest {
  string node_id = 1;
  NodeRole role = 2;
  string observed_topology_epoch = 3;
  uint64 observed_topology_version = 4;
}

message DeregisterNodeResponse {
  bool success = 1;
  uint32 contract_version = 2;
  string topology_epoch = 3;
  uint64 topology_version = 4;
}

// Returns the authoritative logical index-shard placement. A logical shard has
// exactly one generation-fenced primary and zero or more distinct replicas.
message GetShardMapRequest {
  uint64 min_topology_version = 1;
}

message ShardLocation {
  string shard_id = 1;
  string node_id = 2;
  string host = 3;
  int32 port = 4;
  NodeRole role = 5;
  string primary_node_id = 6;
  uint64 generation = 7;
  bool primary = 8;
  bool eligible = 9;
  string state = 10;
}

message NodeInfo {
  reserved 1;
  string node_id = 2;
  string host = 3;
  int32 port = 4;
  NodeRole role = 5;
  int32 health_port = 6;
}

message GetShardMapResponse {
  repeated ShardLocation shard_locations = 1;
  uint32 contract_version = 2;
  string topology_epoch = 3;
  uint64 topology_version = 4;
  int32 replication_factor = 5;
  string durability_policy = 6;
  string read_consistency = 7;
  int32 under_replicated_shards = 8;
  repeated ReplicaRepairStatus repairs = 9;
}

enum ReplicaRepairState {
  REPLICA_REPAIR_STATE_UNKNOWN = 0;
  REPLICA_REPAIR_STATE_CHECKING = 1;
  REPLICA_REPAIR_STATE_MISSING = 2;
  REPLICA_REPAIR_STATE_LAGGING = 3;
  REPLICA_REPAIR_STATE_WRONG_GENERATION = 4;
  REPLICA_REPAIR_STATE_CHECKSUM_DIVERGENT = 5;
  REPLICA_REPAIR_STATE_TRANSFERRING = 6;
  REPLICA_REPAIR_STATE_VERIFYING = 7;
  REPLICA_REPAIR_STATE_READY = 8;
  REPLICA_REPAIR_STATE_PAUSED = 9;
  REPLICA_REPAIR_STATE_FAILED = 10;
}

message ReplicaRepairStatus {
  string repair_id = 1;
  string shard_id = 2;
  string source_node_id = 3;
  string target_node_id = 4;
  ReplicaRepairState state = 5;
  uint64 bytes_transferred = 6;
  uint64 total_bytes = 7;
  uint32 attempts = 8;
  string last_error = 9;
  int64 started_at_epoch_millis = 10;
  int64 updated_at_epoch_millis = 11;
}

message GetReplicaRepairsRequest {}

message GetReplicaRepairsResponse {
  repeated ReplicaRepairStatus repairs = 1;
  bool paused = 2;
}

message ControlReplicaRepairsRequest {
  // Bounded values: pause, resume, retry.
  string action = 1;
  string repair_id = 2;
}

message ControlReplicaRepairsResponse {
  bool success = 1;
  bool paused = 2;
}

service ClusterService {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc DeregisterNode(DeregisterNodeRequest) returns (DeregisterNodeResponse);
  rpc GetShardMap(GetShardMapRequest) returns (GetShardMapResponse);
  rpc getClusterInfo(GetClusterInfoRequest) returns (GetClusterInfoResponse);
  rpc GetReplicaRepairs(GetReplicaRepairsRequest) returns (GetReplicaRepairsResponse);
  rpc ControlReplicaRepairs(ControlReplicaRepairsRequest) returns (ControlReplicaRepairsResponse);
}
