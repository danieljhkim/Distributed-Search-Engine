serviceDiscovery:
  # Clients fail closed until the first authoritative response, then may use the
  # last accepted topology only for this bounded interval during an outage.
  enabled: true
  refreshIntervalSeconds: 10
  nodeExpirySeconds: 30
  maxStalenessSeconds: 30
  coordinatorStateFile: "data/coordinator-topology.properties"

indexNodes:
  # Applies to reads only. Document mutations are routed to the node that owns
  # (partitionId, documentId); see docs/DOCUMENT_OWNERSHIP.md.
  routingStrategy: "LEAST_LOADED"
  componentLabel: "dsearch-index-node"
  # Current runtime has no replication layer; keep this at 1 until replication is implemented.
  replicationFactor: 1
  # This node list is the document ownership ring. Adding or removing an entry
  # reassigns part of the key space and requires a reindex: nothing moves documents.
  nodes:
    - id: "0"
      host: "localhost"
      port: 5000
      healthPort: 5100
    - id: "1"
      host: "localhost"
      port: 5001
      healthPort: 5101

queryNodes:
  routingStrategy: "ROUND_ROBIN"
  componentLabel: "dsearch-query-node"
  nodes:
    - id: "0"
      host: "localhost"
      port: 6000
      healthPort: 6100
    - id: "1"
      host: "localhost"
      port: 6001
      healthPort: 6101

coordinatorNodes:
  routingStrategy: "ROUND_ROBIN"
  componentLabel: "dsearch-coordinator-node"
  nodes:
    - id: "0"
      host: "localhost"
      port: 7000
      healthPort: 7100

indexing:
  maxBufferedOpsPerShard: 100
  maxFlushIntervalSeconds: 5

ml:
  models:
    textEmbedding:
      url: "djl://ai.djl.huggingface.pytorch/sentence-transformers/all-MiniLM-L6-v2"
      engine: "PyTorch"
      predictorPoolSize: 1
      predictorPerCall: false

requestLimits:
  maxSize: 1000
  maxQueryLength: 1024

# Field configurations for filtering, sorting, faceting, and highlighting
