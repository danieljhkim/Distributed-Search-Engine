serviceDiscovery:
  enabled: true
  refreshIntervalSeconds: 10

indexNodes:
  routingStrategy: "LEAST_LOADED"
  componentLabel: "dsearch-index-node"
  nodes:
    - id: "0"
      host: "localhost"
      port: 5000
      healthPort: "5100"
    - id: "1"
      host: "localhost"
      port: 5001
      healthPort: 5101

queryNodes:
  routingStrategy: "ROUND_ROBIN"
  componentLabel: "dsearch-query-node"
  nodes:
    - id: "0"
      host: "localhost"
      port: 6000
      healthPort: 6100
    - id: "1"
      host: "localhost"
      port: 6001
      healthPort: 6101

coordinatorNodes:
  routingStrategy: "ROUND_ROBIN"
  componentLabel: "dsearch-coordinator-node"
  nodes:
    - id: "0"
      host: "localhost"
      port: 7000
      healthPort: 7100

ml:
  models:
    textEmbedding:
      url: "djl://ai.djl.huggingface.pytorch/sentence-transformers/all-MiniLM-L6-v2"
      engine: "PyTorch"

requestLimits:
  maxSize: 1000
  maxQueryLength: 1024
