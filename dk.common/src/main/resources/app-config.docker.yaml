grpcSecurity:
  profile: "production"
  certificateChainPath: "/etc/dsearch/tls/tls.crt"
  privateKeyPath: "/etc/dsearch/tls/tls.key"
  trustCertificateCollectionPath: "/etc/dsearch/tls/ca.crt"

serviceDiscovery:
  enabled: true
  refreshIntervalSeconds: 10
  nodeExpirySeconds: 30
  maxStalenessSeconds: 30
  heartbeatIntervalSeconds: 10
  registrationInitialBackoffMillis: 250
  registrationMaxBackoffSeconds: 10
  membershipRpcDeadlineMillis: 2000
  shutdownDeregisterTimeoutMillis: 1000
  # The Compose coordinator-state volume is mounted at /data. The service also
  # maintains /data/coordinator-topology.properties.bak for manual recovery.
  coordinatorStateFile: "/data/coordinator-topology.properties"

indexNodes:
  # Applies to reads only. Document mutations are routed to the node that owns
  # (partitionId, documentId); see docs/DOCUMENT_OWNERSHIP.md.
  routingStrategy: "LEAST_LOADED"
  componentLabel: "dsearch-index-node"
  replicationFactor: 2
  durabilityPolicy: "all"
  readConsistency: "acknowledged"
  # This node list is the document ownership ring. Adding or removing an entry
  # reassigns part of the key space and requires a reindex: nothing moves documents.
  nodes:
    - id: "in0"
      host: "dsearch-index-0"
      port: 6000
      healthPort: 8090
    - id: "in1"
      host: "dsearch-index-1"
      port: 6000
      healthPort: 8090

queryNodes:
  routingStrategy: "ROUND_ROBIN"
  componentLabel: "dsearch-query-node"
  nodes:
    - id: "qn0"
      host: "dsearch-query-0"
      port: 50052
      healthPort: 8081

gatewayNodes:
  routingStrategy: "ROUND_ROBIN"
  componentLabel: "dsearch-gateway-node"
  nodes:
    - id: "gw0"
      host: "dsearch-gateway"
      port: 8080
      healthPort: 8180

requestLimits:
  requestTimeoutMillis: 3000
  maxSize: 1000
  maxResultWindow: 10000
  maxQueryLength: 1024
  maxHttpBodyBytes: 1048576
  maxGrpcInboundBytes: 2097152
  maxDocumentIdBytes: 512
  maxFieldsPerDocument: 100
  maxFieldValueBytes: 65536
  maxIndexPayloadBytes: 1048576
  maxBulkItems: 100
  maxBulkEmbeddingBytes: 524288
  maxFilterClauses: 100
  maxFacetCount: 20
  maxFacetDepth: 3
  maxAnalyzeTextBytes: 8192
  maxAnalyzeTokens: 256
  maxConcurrentHttpRequests: 128
  maxConcurrentFanoutCalls: 64
  retryAfterMillis: 100

indexing:
  maxBufferedOpsPerShard: 100
  maxFlushIntervalSeconds: 5
  minimumFreeDiskBytes: 104857600
  analyzer: "standard"

coordinatorNodes:
  routingStrategy: "ROUND_ROBIN"
  componentLabel: "dsearch-coordinator-node"
  nodes:
    - id: "c0"
      host: "dsearch-coordinator"
      port: 7000
      healthPort: 8080

ml:
  models:
    textEmbedding:
      url: "djl://ai.djl.huggingface.pytorch/sentence-transformers/all-MiniLM-L6-v2"
      engine: "PyTorch"
      dimension: 384

