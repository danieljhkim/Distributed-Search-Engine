serviceDiscovery:
  enabled: true
  refreshIntervalSeconds: 1
  nodeExpirySeconds: 1
  maxStalenessSeconds: 1
  heartbeatIntervalSeconds: 1
  registrationInitialBackoffMillis: 50
  registrationMaxBackoffSeconds: 1
  membershipRpcDeadlineMillis: 250
  shutdownDeregisterTimeoutMillis: 250

indexNodes:
  routingStrategy: "ROUND_ROBIN"
  componentLabel: "process-index"
  nodes: []

queryNodes:
  routingStrategy: "ROUND_ROBIN"
  componentLabel: "process-query"
  nodes: []

coordinatorNodes:
  routingStrategy: "ROUND_ROBIN"
  componentLabel: "process-coordinator"
  nodes: []
