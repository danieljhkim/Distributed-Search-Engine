version: "3.9"

name: dsearch

networks:
  dsearch-net:

volumes:
  coordinator-state:
  indexnode0-data:

services:
  coordinator:
    # If building locally:
    build:
      context: .
      dockerfile: dk.coordinator/Dockerfile
    # If using GHCR instead, comment build and uncomment image:
    # image: ghcr.io/<owner>/<repo>/dk.coordinator:latest

    container_name: dsearch-coordinator
    networks:
      dsearch-net:
        aliases:
          - dsearch-coordinator
    environment:
      COORDINATOR_PORT: "7000"
      COORDINATOR_HEALTH_PORT: "8080"
      APP_CONFIG_PATH: "app-config.docker.yaml"
      COORDINATOR_STATE_FILE: "/data/coordinator-topology.properties"
    restart: unless-stopped
    volumes:
      - coordinator-state:/data
      - "${DSEARCH_TLS_DIR:?set DSEARCH_TLS_DIR to a directory containing per-service certificates}/coordinator:/etc/dsearch/tls:ro"

  gateway:
    build:
      context: .
      dockerfile: dk.gateway/Dockerfile

    container_name: dsearch-gateway
    networks:
      dsearch-net:
        aliases:
          - dsearch-gateway
    environment:
      GATEWAY_PORT: "8080"
      GATEWAY_HEALTH_PORT: "8180"
      COORDINATOR_HOST: "dsearch-coordinator"
      COORDINATOR_PORT: "7000"
      APP_CONFIG_PATH: "app-config.docker.yaml"
    ports:
      - "19080:8080"
    depends_on:
      - coordinator
    restart: unless-stopped
    volumes:
      - "${DSEARCH_TLS_DIR:?set DSEARCH_TLS_DIR to a directory containing per-service certificates}/gateway:/etc/dsearch/tls:ro"

  query-node-0:
    build:
      context: .
      dockerfile: dk.query-node/Dockerfile
    container_name: dsearch-query-0
    networks:
      dsearch-net:
        aliases:
          - dsearch-query-0
    environment:
      QUERY_NODE_ID: "qn0"
      QUERY_NODE_PORT: "50052"
      QUERY_NODE_HEALTH_PORT: "8081"
      APP_CONFIG_PATH: "app-config.docker.yaml"
    depends_on:
      - coordinator
      - gateway
    restart: unless-stopped
    volumes:
      - "${DSEARCH_TLS_DIR:?set DSEARCH_TLS_DIR to a directory containing per-service certificates}/query-node-0:/etc/dsearch/tls:ro"

  index-node-0:
    build:
      context: .
      dockerfile: dk.index-node/Dockerfile
    container_name: dsearch-index-0
    networks:
      dsearch-net:
        aliases:
          - dsearch-index-0
    environment:
      INDEX_NODE_ID: "in0"
      INDEX_NODE_PORT: "6000"
      INDEX_NODE_HEALTH_PORT: "8090"
      # Where Lucene shards live (your code uses baseDir; map that to this)
      INDEX_NODE_BASE_DIR: "/data/index"
      APP_CONFIG_PATH: "app-config.docker.yaml"
    volumes:
      - indexnode0-data:/data/index
      - "${DSEARCH_TLS_DIR:?set DSEARCH_TLS_DIR to a directory containing per-service certificates}/index-node-0:/etc/dsearch/tls:ro"
    depends_on:
      - coordinator
    restart: unless-stopped
