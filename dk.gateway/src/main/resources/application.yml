server:
  port: ${port:8080}
  host: ${host:localhost}

spring:
  application:
    name: gateway-node

shards:
  snapshot:
    interval: ${shard.snapshot.interval:6000} # in milliseconds

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - [reqId=%X{requestId}] %msg%n"